apply plugin: 'com.android.library'
android {
 namespace 'com.ar.workspace'
 compileSdk 35
 defaultConfig { minSdk 25; targetSdk 35 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { compileOnly files('../libs/unity-classes.jar'); implementation 'org.mozilla.geckoview:geckoview:143.0.20251003115653'; implementation 'com.alphacephei:vosk-android:0.3.75@aar'; implementation 'net.java.dev.jna:jna:5.18.1@aar' }

 tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
